<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Propositions branding - 10cordes-bot</title>
<style>
body{background:#111114;color:#f2f2f5;font-family:system-ui,sans-serif;padding:2rem}
h1{color:#f2f2f5}h2{color:#a0a0ad;margin-top:2.5rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
figure{margin:0;background:#19191E;border:1px solid #303038;border-radius:8px;padding:.6rem;text-align:center}
img{width:100%;image-rendering:pixelated;border-radius:4px}

<h1>Propositions branding - 10cordes-bot</h1>
<p class="note">Palette Tenkai : fond #111114, accents de la série de charts. Pour utiliser : renommer le fichier choisi en bot-icon-128.png ou support-icon-128.png (ou uploader directement sur Discord).</p>
