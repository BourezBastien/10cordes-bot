packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  'esbuild': true
  'tsdown': true
  'msgpackr-extract': true
  ffmpeg-static: true

minimumReleaseAgeExclude:
  - i18next@27.1.3
  - react-i18next@18.0.2
  - bullmq@6.7.7
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/react-query@5.108.0'
