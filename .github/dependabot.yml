# Dépendances : une passe par semaine, le lundi matin. `develop` est la
# branche par défaut du dépôt, les PR de version et les mises à jour de
# sécurité y vont d'office. Ne pas définir `target-branch` : dès qu'il est
# défini, les options de ce fichier ne s'appliquent plus aux mises à jour de
# sécurité (elles suivraient leur calendrier par défaut).
#
# Les versions mineures et correctives des paquets npm arrivent groupées dans
# une seule PR ; les majeures restent une par dépendance, à regarder une à une.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Le framework a aligné sa numérotation sur 0.9.x le 9 novembre 2026 : ses 1.0.x
      # et 2.0.x sont PLUS ANCIENS que 0.9.x, et attendent @spraxium/logger@0.3.x (une
      # seconde copie du logger à côté de celle du projet). Les PR #4, #6 et #10 du
      # 25/11/2026 étaient ces régressions, à CI verte. Les versions mineures et
      # correctives (0.9.1) restent proposées. À retirer quand une vraie 1.x sortira.
      - dependency-name: "@spraxium/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      actions:
        patterns:
          - "*"
