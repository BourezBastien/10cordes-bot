services:
  bot:
    build: .
    restart: unless-stopped
    # tini en PID 1 : SIGTERM arrive jusqu'à node, et les processus fils (ffmpeg,
    # moteurs Prisma) sont recolectés au lieu de rester zombies.
    init: true
    # Plus long que le délai de grâce du bot (SHUTDOWN_GRACE_MS, 20 s) : une
    # demande en cours a le temps de finir avant que Docker tue le conteneur.
    stop_grace_period: 30s
    # Le .env réel vit dans apps/bot/ (celui de la racine n'existe pas).
    env_file:
      - path: ./apps/bot/.env
        required: false
    environment:
      DATABASE_URL: file:../data/bot.db
      # Le réseau Docker résout le service par son nom (jamais 127.0.0.1).
      REDIS_URL: redis://redis:6379
      # Le serveur HTTP doit écouter sur toutes les interfaces du conteneur
      # pour que le port publié soit joignable (défaut local : 127.0.0.1).
      HTTP_HOST: 0.0.0.0
    ports:
      - '3000:3000'
    volumes:
      - bot-data:/app/apps/bot/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  bot-data:
  redis-data:
