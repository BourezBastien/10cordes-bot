services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:../data/bot.db
    ports:
      - '3000:3000'
    volumes:
      - bot-data:/app/apps/bot/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  bot-data:
  redis-data:
